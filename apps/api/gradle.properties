# The reload loop invokes Gradle on every file change, so Gradle's own startup
# overhead is paid on every edit -- it is a large share of the reload time, not
# a one-off cost. These settings target that overhead specifically.

# Skips re-running the configuration phase when nothing about the build script
# changed, which is the common case during a coding session.
org.gradle.configuration-cache=true

# Reuses task outputs across invocations.
org.gradle.caching=true
org.gradle.parallel=true

# The daemon's heap. Left unbounded it competes with the application JVM and
# the container's mem_limit, and the loser is whichever allocates second.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m
